name: ALEPH XDR-02 & XDR-03 verification
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Independently replay and test both XDR modules
        run: npm test
      - name: Rebuild and verify original XDR-02 dashboard
        run: |
          npm run xdr:run -- web-injection
          npm run build
      - name: Rebuild original-fixture XDR-03 response and demo
        run: |
          npm run xdr:run -- known-cve
          npm run build:known-cve
      - name: Verify deterministic committed reports and both dashboards
        run: |
          git diff --exit-code -- xdr/web-injection/result.json xdr/known-cve/result.json xdr/alerts.log xdr/temporary-deny.json public/report.json public/samples.json public/decide.mjs public/index.html public/app.js public/styles.css public-known-cve
