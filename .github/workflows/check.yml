name: Verify XDR-02 Web Injection
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Replay original Wazuh fixture and generate ZTNA rules
        run: npm run xdr:run -- web-injection
      - name: Unit and behavioral tests
        run: npm test
      - name: Replay twice to detect non-determinism
        run: npm run xdr:run -- web-injection
      - name: Build Vercel static site
        run: npm run build
      - name: Confirm committed results match actual generated output
        run: |
          git diff --exit-code -- xdr/web-injection/result.json xdr/alerts.log xdr/temporary-deny.json public/report.json public/samples.json public/decide.mjs public/index.html public/app.js public/styles.css
